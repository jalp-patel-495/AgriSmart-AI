# AgriSmart AI – Unified Machine Learning Configuration
# Supports Crop Disease Detection, Crop Recommendation, Irrigation, and Diagnostics

project_name: "AGRISMART_AI"
random_seed: 42
device: "auto"  # "auto", "cuda", or "cpu"

disease:
  # Dataset configuration (auto-detected if path is relative or default)
  dataset_path: "dataset/raw"
  fallback_dataset_paths:
    - "dataset/raw"
    - "dataset/processed/train"
    - "dataset"
    - "../dataset/raw"
    - "../dataset"
    - "data/PlantVillage"
  
  # Image parameters
  image_size: 224
  batch_size: 32
  num_workers: 0  # 0 is safest across Windows multiprocessing
  validation_split: 0.2
  
  # Training hyperparameters
  stage1_epochs: 2
  stage2_epochs: 2
  learning_rate: 0.001
  fine_tune_learning_rate: 0.0001
  weight_decay: 0.0001
  dropout: 0.3
  patience: 3
  
  # Loss and sampling
  loss_function: "weighted_cross_entropy"  # "weighted_cross_entropy", "focal_loss", "cross_entropy"
  focal_gamma: 2.0
  use_weighted_sampler: false
  
  # Models to train and compare
  models_to_train:
    - "efficientnet_b0"
    - "resnet50"
    - "densenet121"
    - "mobilenet_v3"
    - "convnext_tiny"

  # Inference & deployment
  confidence_threshold: 0.60
  top_k: 3
  output_dir: "models/disease"
  reports_dir: "reports"

crop_recommendation:
  dataset_path: "data/crop_recommendation.csv"
  models:
    - "random_forest"
    - "gradient_boosting"
  output_dir: "models/crop_recommendation"
  test_size: 0.2

irrigation:
  dataset_path: "data/irrigation_data.csv"
  models:
    - "logistic_regression"
    - "random_forest"
    - "gradient_boosting"
  output_dir: "models/irrigation"
  test_size: 0.2

stress:
  dataset_path: "data/crop_stress.csv"
  output_dir: "models/stress"

yield_prediction:
  dataset_path: "data/crop_yield.csv"
  output_dir: "models/yield"

sustainability:
  soil_weight: 0.30
  water_weight: 0.30
  crop_health_weight: 0.25
  resource_weight: 0.15
